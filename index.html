<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL 2026 Season Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ═══════════════ TEAM PICKER ═══════════════ -->
  <div id="picker">
    <div class="hero">
      <div class="hero-eyebrow">2026 NFL Season</div>
      <h1>PICK YOUR<br><span>TEAM</span></h1>
      <p>Select a team to predict their 2026 season game by game</p>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search teams..." oninput="renderTeams()">
    </div>

    <div id="team-list"></div>
  </div>

  <!-- ═══════════════ SCHEDULE ═══════════════ -->
  <div id="schedule">
    <div class="sched-header">
      <button class="back-btn" onclick="goBack()">← BACK</button>
      <div id="sched-badge" class="sched-badge"></div>
      <div>
        <div id="sched-title" class="sched-title"></div>
        <div id="sched-sub" class="sched-sub"></div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div id="stat-w" class="stat-num" style="color:var(--win)">0</div>
        <div class="stat-lbl">Predicted Wins</div>
      </div>
      <div class="stat">
        <div id="stat-l" class="stat-num" style="color:var(--loss)">0</div>
        <div class="stat-lbl">Predicted Losses</div>
      </div>
      <div class="stat">
        <div id="stat-u" class="stat-num" style="color:var(--muted)">0</div>
        <div class="stat-lbl">Unpicked</div>
      </div>
    </div>

    <div class="export-row">
      <button id="export-btn" class="export-btn" onclick="exportImage()">📸 EXPORT IMAGE</button>
    </div>

    <div class="card" id="pred-card">
      <div class="card-head" id="card-head">
        <div id="card-badge" class="sched-badge"></div>
        <div class="card-head-info">
          <div id="card-name" class="card-head-name"></div>
          <div class="card-head-sub">2026 SEASON PREDICTIONS</div>
        </div>
        <div class="card-head-record">
          <span id="rec-w" class="w">0W</span>
          <span class="dash">–</span>
          <span id="rec-l" class="l">0L</span>
        </div>
      </div>
      <div id="game-rows"></div>
      <div class="card-footer">NFL SEASON PREDICTOR 2026</div>
    </div>
  </div>

  <script src="js.js" defer></script>
</body>

</html>
