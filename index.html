<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NFL 2026 Season Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a14;
    --surface: #11111e;
    --border: #1c1c2e;
    --text: #e2e2ee;
    --muted: #555570;
    --win: #22c55e;
    --loss: #e94560;
    --home: #4ade80;
    --away: #f97316;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── PICKER SCREEN ── */
  #picker {
    max-width: 940px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }

  .hero {
    text-align: center;
    margin-bottom: 44px;
  }
  .hero-eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 700;
    line-height: 0.95;
    color: #fff;
    letter-spacing: 2px;
  }
  .hero h1 span { color: var(--loss); }
  .hero p {
    margin-top: 14px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 400;
  }

  .search-wrap {
    position: relative;
    margin-bottom: 32px;
  }
  .search-wrap input {
    width: 100%;
    padding: 14px 20px 14px 48px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: #333355; }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.35;
    font-size: 17px;
    pointer-events: none;
  }

  .conf-group { margin-bottom: 28px; }
  .conf-label {
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: #333350;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 2px;
  }
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }

  .team-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.13s, filter 0.13s, border-color 0.13s;
  }
  .team-card:hover {
    transform: translateY(-2px) scale(1.02);
    filter: brightness(1.2);
    border-color: #2a2a45;
  }

  .badge {
    width: 40px; height: 40px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.1);
    letter-spacing: 0.5px;
  }

  .team-card-info { min-width: 0; }
  .team-card-city { font-size: 13px; font-weight: 600; color: #ddd; line-height: 1.2; }
  .team-card-div  { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* ── SCHEDULE SCREEN ── */
  #schedule { display: none; max-width: 780px; margin: 0 auto; padding: 26px 16px 70px; }

  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: #888;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-btn:hover { color: #ccc; border-color: #333; }

  .sched-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }

  .sched-badge {
    width: 50px; height: 50px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    flex-shrink: 0; border: 2px solid rgba(255,255,255,0.12);
  }

  .sched-title { font-family: 'Oswald', sans-serif; font-size: clamp(20px,4vw,30px); font-weight: 700; color: #fff; letter-spacing: 1px; line-height: 1; }
  .sched-sub   { font-size: 10px; color: var(--muted); letter-spacing: 3px; margin-top: 3px; }

  .stats-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .stat { text-align: center; }
  .stat-num  { font-family: 'Oswald', sans-serif; font-size: clamp(28px,5vw,44px); font-weight: 700; line-height: 1; }
  .stat-lbl  { font-size: 9px; color: var(--muted); letter-spacing: 3px; margin-top: 3px; text-transform: uppercase; }

  .export-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .export-btn {
    padding: 9px 22px;
    border-radius: 9px;
    border: none;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    color: #fff;
    transition: filter 0.15s;
  }
  .export-btn:hover { filter: brightness(1.15); }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .card-head {
    padding: 18px 22px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card-head-info { flex: 1; min-width: 0; }
  .card-head-name { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 2px; }
  .card-head-sub  { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 4px; margin-top: 2px; }
  .card-head-record { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; white-space: nowrap; }
  .card-head-record .w { color: var(--win); }
  .card-head-record .dash { color: #444; font-size: 18px; margin: 0 5px; }
  .card-head-record .l { color: var(--loss); }

  .game-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    border-top: 1px solid #0f0f1e;
    transition: background 0.12s;
  }
  .game-row:hover:not(.bye-row) { background: rgba(255,255,255,0.03); }
  .game-row.win-row  { background: rgba(34,197,94,0.05); }
  .game-row.loss-row { background: rgba(233,69,96,0.05); }
  .bye-row { opacity: 0.45; }

  .col-week { width: 44px; font-size: 10px; color: #444; font-weight: 600; flex-shrink: 0; }
  .col-date { width: 52px; font-size: 11px; color: #555; flex-shrink: 0; }

  .ha-pill {
    width: 36px; height: 17px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .ha-home { background: rgba(74,222,128,0.12); color: var(--home); }
  .ha-away { background: rgba(249,115,22,0.12); color: var(--away); }

  .opp-wrap { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
  .opp-badge { width: 30px; height: 30px; border-radius: 5px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 8px; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
  .opp-name { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bye-label { font-family: 'Oswald', sans-serif; font-size: 13px; color: #333; letter-spacing: 2px; }

  .pick-btns { display: flex; gap: 5px; flex-shrink: 0; }
  .pick-btn {
    width: 38px; height: 30px; border-radius: 7px; border: none; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px;
    background: #13131f; color: #333;
    transition: all 0.13s;
  }
  .pick-btn:hover { filter: brightness(1.3); transform: scale(1.06); }
  .pick-btn.active-w { background: var(--win);  color: #fff; box-shadow: 0 0 10px rgba(34,197,94,0.4); }
  .pick-btn.active-l { background: var(--loss); color: #fff; box-shadow: 0 0 10px rgba(233,69,96,0.4); }

  .card-footer {
    padding: 10px 18px;
    border-top: 1px solid #0f0f1e;
    text-align: right;
    font-size: 9px;
    color: #1e1e2e;
    letter-spacing: 3px;
    font-family: 'Oswald', sans-serif;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
</style>
</head>
<body>

<!-- ═══════════════ TEAM PICKER ═══════════════ -->
<div id="picker">
  <div class="hero">
    <div class="hero-eyebrow">2026 NFL Season</div>
    <h1>PICK YOUR<br><span>TEAM</span></h1>
    <p>Select a team to predict their 2026 season game by game</p>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search teams..." oninput="renderTeams()">
  </div>

  <div id="team-list"></div>
</div>

<!-- ═══════════════ SCHEDULE ═══════════════ -->
<div id="schedule">

  <div class="stats-bar">

    <div class="stat"><div id="stat-u" class="stat-num" style="color:var(--muted)">0</div><div class="stat-lbl">Unpicked</div></div>
  </div>

  <div class="export-row">
    <button id="export-btn" class="export-btn" onclick="exportImage()">📸 EXPORT IMAGE</button>
  </div>

  <div class="card" id="pred-card">
    <div class="card-head" id="card-head">

      </div>
    </div>
    <div id="game-rows"></div>
    <div class="card-footer">NFL SEASON PREDICTOR 2026</div>
  </div>
</div>

  TEN:[{w:1,d:"Sep 13",o:"NYJ",h:1},{w:2,d:"Sep 20",o:"PHI",h:1},{w:3,d:"Sep 27",o:"NYG",h:0},{w:4,d:"Oct 4",o:"BAL",h:0},{w:5,d:"Oct 11",o:"HOU",h:1},{w:6,d:"Oct 18",o:"IND",h:0},{w:7,d:"Oct 25",o:"CLE",h:1},{w:8,d:"Nov 1",o:"CIN",h:0},{w:9,d:"Nov 8",o:"BYE",h:0},{w:10,d:"Nov 15",o:"JAC",h:1},{w:11,d:"Nov 22",o:"DAL",h:0},{w:12,d:"Nov 29",o:"JAC",h:0},{w:13,d:"Dec 6",o:"WAS",h:1},{w:14,d:"Dec 13",o:"DET",h:0},{w:15,d:"Dec 20",o:"IND",h:1},{w:16,d:"Dec 27",o:"LV",h:0},{w:17,d:"Jan 3",o:"PIT",h:1},{w:18,d:"Jan 9",o:"HOU",h:0}],
  WAS:[{w:1,d:"Sep 13",o:"PHI",h:0},{w:2,d:"Sep 20",o:"DAL",h:0},{w:3,d:"Sep 27",o:"SEA",h:1},{w:4,d:"Oct 4",o:"IND",h:1},{w:5,d:"Oct 11",o:"NYG",h:0},{w:6,d:"Oct 19",o:"SF",h:0},{w:7,d:"Oct 25",o:"BYE",h:0},{w:8,d:"Nov 1",o:"PHI",h:1},{w:9,d:"Nov 8",o:"LA",h:1},{w:10,d:"Nov 12",o:"NYG",h:0},{w:11,d:"Nov 23",o:"CIN",h:1},{w:12,d:"Nov 29",o:"ARI",h:0},{w:13,d:"Dec 6",o:"TEN",h:0},{w:14,d:"Dec 13",o:"HOU",h:1},{w:15,d:"Dec 20",o:"ATL",h:1},{w:16,d:"Dec 27",o:"MIN",h:0},{w:17,d:"Jan 3",o:"JAC",h:0},{w:18,d:"Jan 9",o:"DAL",h:1}],
};

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let currentTeam = null;
let picks = {}; // { "w1": "W"|"L", ... }

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function badgeStyle(abbr, size=40) {
  const t = TEAMS[abbr];
  if (!t) return '';
  return `background: linear-gradient(135deg, ${t.c[0]} 55%, ${t.c[1]} 100%); width:${size}px; height:${size}px; border-radius:${Math.round(size*0.175)}px; font-size:${Math.round(size*0.27)}px;`;
}

function grouped() {
  const g = {};
  for (const [abbr, t] of Object.entries(TEAMS)) {
    const k = `${t.conf} · ${t.div}`;
    if (!g[k]) g[k] = [];
    g[k].push(abbr);
  }
  return g;
}

// ─────────────────────────────────────────
// RENDER TEAM PICKER
// ─────────────────────────────────────────
function renderTeams() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('team-list');
  list.innerHTML = '';

  if (q) {
    const matches = Object.entries(TEAMS).filter(([a,t]) =>
      t.name.toLowerCase().includes(q) || a.toLowerCase().includes(q)
    );
    const grid = document.createElement('div');
    grid.className = 'team-grid';
    matches.forEach(([abbr,t]) => grid.appendChild(makeCard(abbr, t)));
    list.appendChild(grid);
    return;
  }

  const g = grouped();
  Object.entries(g).sort().forEach(([label, abbrs]) => {
    const sec = document.createElement('div');
    sec.className = 'conf-group';
    sec.innerHTML = `<div class="conf-label">${label}</div>`;
    const grid = document.createElement('div');
    grid.className = 'team-grid';
    abbrs.forEach(abbr => grid.appendChild(makeCard(abbr, TEAMS[abbr])));
    sec.appendChild(grid);
    list.appendChild(sec);
  });
}

function makeCard(abbr, t) {
  const div = document.createElement('div');
  div.className = 'team-card';
  div.innerHTML = `
    <div class="badge" style="${badgeStyle(abbr,40)}">${abbr}</div>
    <div class="team-card-info">
      <div class="team-card-city">${t.city}</div>
      <div class="team-card-div">${t.conf} · ${t.div}</div>
    </div>`;
  div.onclick = () => selectTeam(abbr);
  return div;
}

// ─────────────────────────────────────────
// SELECT TEAM → show schedule screen
// ─────────────────────────────────────────
function selectTeam(abbr) {
  currentTeam = abbr;
  picks = {};
  const t = TEAMS[abbr];

  document.getElementById('picker').style.display = 'none';
  document.getElementById('schedule').style.display = 'block';
  window.scrollTo(0, 0);

  // Header badge + title
  const badgeEl = document.getElementById('sched-badge');
  badgeEl.style.cssText = badgeStyle(abbr, 50);
  badgeEl.textContent = abbr;

  document.getElementById('sched-title').textContent = t.name.toUpperCase();
  document.getElementById('sched-sub').textContent   = `${t.conf} · ${t.div} DIVISION`;

  // Card header
  const cardBadge = document.getElementById('card-badge');
  cardBadge.style.cssText = badgeStyle(abbr, 50);
  cardBadge.textContent = abbr;
  document.getElementById('card-name').textContent = t.name.toUpperCase();

  // Export button color
  document.getElementById('export-btn').style.background = t.c[1] || '#e94560';

  // Card header gradient
  document.getElementById('card-head').style.background =
    `linear-gradient(135deg, ${t.c[0]}cc, ${t.c[1]}66)`;

  renderRows();
  updateStats();
}

function goBack() {
  document.getElementById('schedule').style.display = 'none';
  document.getElementById('picker').style.display   = 'block';
  currentTeam = null;
  picks = {};
  window.scrollTo(0, 0);
}

// ─────────────────────────────────────────
// RENDER GAME ROWS
// ─────────────────────────────────────────
function renderRows() {
  const container = document.getElementById('game-rows');
  container.innerHTML = '';
  const games = SCHEDULES[currentTeam] || [];

  games.forEach(g => {
    const isBye = g.o === 'BYE';
    const pick  = picks[`w${g.w}`];
    const row   = document.createElement('div');

    let rowClass = 'game-row';
    if (isBye)        rowClass += ' bye-row';
    else if (pick==='W') rowClass += ' win-row';
    else if (pick==='L') rowClass += ' loss-row';
    row.className = rowClass;

    if (isBye) {
      row.innerHTML = `
        <div class="col-week">WK ${g.w}</div>
        <div class="col-date">${g.d}</div>
        <div class="bye-label">— BYE WEEK —</div>`;
    } else {
      const opp  = TEAMS[g.o] || {};
      const wBtn = `<button class="pick-btn${pick==='W'?' active-w':''}" onclick="doPick('w${g.w}','W')">W</button>`;
      const lBtn = `<button class="pick-btn${pick==='L'?' active-l':''}" onclick="doPick('w${g.w}','L')">L</button>`;
      row.innerHTML = `
        <div class="col-week">WK ${g.w}</div>
        <div class="col-date">${g.d}</div>
        <div class="ha-pill ${g.h?'ha-home':'ha-away'}">${g.h?'HOME':'AWAY'}</div>
        <div class="opp-wrap">
          <div class="opp-badge" style="${badgeStyle(g.o,30)}">${g.o}</div>
          <div class="opp-name">${opp.name||g.o}</div>
        </div>
        <div class="pick-btns">${wBtn}${lBtn}</div>`;
    }
    container.appendChild(row);
  });
}

function doPick(key, val) {
  // Toggle: clicking same pick again clears it
  picks[key] = picks[key] === val ? undefined : val;
  renderRows();
  updateStats();
}

function updateStats() {
  const games = (SCHEDULES[currentTeam]||[]).filter(g => g.o !== 'BYE');
  const w = Object.values(picks).filter(v=>v==='W').length;
  const l = Object.values(picks).filter(v=>v==='L').length;
  const u = games.length - w - l;
  document.getElementById('stat-w').textContent = w;
  document.getElementById('stat-l').textContent = l;
  document.getElementById('stat-u').textContent = u;
  document.getElementById('rec-w').textContent  = `${w}W`;
  document.getElementById('rec-l').textContent  = `${l}L`;
}

// ─────────────────────────────────────────
// EXPORT — pure Canvas API, no libraries
// ─────────────────────────────────────────
function exportImage() {
  const abbr  = currentTeam;
  const t     = TEAMS[abbr];
  const games = SCHEDULES[abbr] || [];
  const [p1, p2] = t.c;

  const W    = 700;
  const ROW  = 44;
  const HEAD = 90;
  const FOOT = 36;
  const PAD  = 28;
  const DPR  = 2;
  const H    = HEAD + games.length * ROW + FOOT;

  const cv  = document.createElement('canvas');
  cv.width  = W * DPR;
  cv.height = H * DPR;
  const cx  = cv.getContext('2d');
  cx.scale(DPR, DPR);

  // bg
  cx.fillStyle = '#0a0a14';
  cx.fillRect(0, 0, W, H);

  // header gradient
  const hg = cx.createLinearGradient(0, 0, W, HEAD);
  hg.addColorStop(0, p1 + 'cc');
  hg.addColorStop(1, p2 + '66');
  cx.fillStyle = hg;
  cx.fillRect(0, 0, W, HEAD);

  // team badge
  const bs = 52, bx = PAD, by = (HEAD - bs) / 2;
  const bg = cx.createLinearGradient(bx, by, bx+bs, by+bs);
  bg.addColorStop(0, p1); bg.addColorStop(1, p2);
  cx.fillStyle = bg;
  rr(cx, bx, by, bs, bs, 8); cx.fill();
  cx.fillStyle = '#fff';
  cx.font = `bold ${Math.floor(bs*.28)}px Oswald,sans-serif`;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(abbr, bx+bs/2, by+bs/2);

  // team name
  cx.textAlign = 'left';
  cx.fillStyle = '#ffffff';
  cx.font = 'bold 21px Oswald,sans-serif';
  cx.fillText(t.name.toUpperCase(), bx+bs+16, by+15);
  cx.fillStyle = 'rgba(255,255,255,.4)';
  cx.font = '500 10px DM Sans,sans-serif';
  cx.fillText('2026 SEASON PREDICTIONS', bx+bs+16, by+34);

  // record
  const wins   = Object.values(picks).filter(v=>v==='W').length;
  const losses = Object.values(picks).filter(v=>v==='L').length;
  cx.textAlign = 'right';
  cx.font = 'bold 26px Oswald,sans-serif';
  cx.fillStyle = '#22c55e'; cx.fillText(`${wins}W`,   W-PAD-34, HEAD/2+6);
  cx.fillStyle = '#444';    cx.font='bold 18px Oswald,sans-serif';
  cx.fillText('–', W-PAD-12, HEAD/2+4);
  cx.fillStyle = '#e94560'; cx.font='bold 26px Oswald,sans-serif';
  cx.fillText(`${losses}L`, W-PAD, HEAD/2+6);

  // rows
  games.forEach((g, i) => {
    const y    = HEAD + i * ROW;
    const isBye = g.o === 'BYE';
    const pick  = picks[`w${g.w}`];
    const mid   = y + ROW / 2;

    if (!isBye) {
      if (pick==='W') { cx.fillStyle='rgba(34,197,94,.07)';  cx.fillRect(0,y,W,ROW); }
      if (pick==='L') { cx.fillStyle='rgba(233,69,96,.07)';  cx.fillRect(0,y,W,ROW); }
    } else {
      cx.fillStyle='rgba(255,255,255,.015)'; cx.fillRect(0,y,W,ROW);
    }
    cx.strokeStyle='#0f0f1e'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(0,y+ROW); cx.lineTo(W,y+ROW); cx.stroke();

    cx.textBaseline='middle';
    cx.fillStyle = isBye?'#2a2a3a':'#3a3a55';
    cx.font='600 10px DM Sans,sans-serif'; cx.textAlign='left';
    cx.fillText(`WK ${g.w}`, PAD, mid);

    cx.fillStyle=isBye?'#2a2a3a':'#444'; cx.font='400 11px DM Sans,sans-serif';
    cx.fillText(g.d, PAD+50, mid);

    if (isBye) {
      cx.fillStyle='#2a2a3a'; cx.font='500 12px Oswald,sans-serif';
      cx.fillText('— BYE WEEK —', PAD+120, mid);
      return;
    }

    // home/away
    cx.fillStyle = g.h ? 'rgba(74,222,128,.12)' : 'rgba(249,115,22,.12)';
    rr(cx, PAD+112, mid-9, 38, 18, 4); cx.fill();
    cx.fillStyle = g.h ? '#4ade80' : '#f97316';
    cx.font='bold 8px DM Sans,sans-serif'; cx.textAlign='center';
    cx.fillText(g.h?'HOME':'AWAY', PAD+112+19, mid);

    // opp badge
    const oc = (TEAMS[g.o]||{}).c || ['#333','#666'];
    const os=30, ox=PAD+160, oy=mid-os/2;
    const og = cx.createLinearGradient(ox,oy,ox+os,oy+os);
    og.addColorStop(0,oc[0]); og.addColorStop(1,oc[1]);
    cx.fillStyle=og; rr(cx,ox,oy,os,os,5); cx.fill();
    cx.fillStyle='#fff'; cx.font=`bold ${Math.floor(os*.27)}px Oswald,sans-serif`;
    cx.textAlign='center'; cx.fillText(g.o, ox+os/2, mid);

    // opp name
    cx.textAlign='left'; cx.fillStyle='#bbb';
    cx.font='600 13px Oswald,sans-serif';
    cx.fillText((TEAMS[g.o]||{}).name||g.o, ox+os+10, mid);

    // pick pill
    const pw=42, ph=26, px2=W-PAD-pw, py2=mid-ph/2;
    if (pick) {
      cx.fillStyle = pick==='W'?'#22c55e':'#e94560';
      cx.shadowColor  = pick==='W'?'rgba(34,197,94,.5)':'rgba(233,69,96,.5)';
      cx.shadowBlur   = 10;
      rr(cx,px2,py2,pw,ph,6); cx.fill();
      cx.shadowBlur=0;
      cx.fillStyle='#fff'; cx.font='bold 13px Oswald,sans-serif';
      cx.textAlign='center'; cx.fillText(pick, px2+pw/2, mid);
    } else {
      cx.fillStyle='#13131f'; rr(cx,px2,py2,pw,ph,6); cx.fill();
      cx.fillStyle='#2a2a3a'; cx.font='bold 14px Oswald,sans-serif';
      cx.textAlign='center'; cx.fillText('?', px2+pw/2, mid);
    }
  });

  // footer
  const fy = HEAD + games.length * ROW;
  cx.fillStyle='#0a0a14'; cx.fillRect(0,fy,W,FOOT);
  cx.strokeStyle='#0f0f1e'; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(0,fy); cx.lineTo(W,fy); cx.stroke();
  cx.fillStyle='#1e1e2e'; cx.font='500 9px DM Sans,sans-serif';
  cx.textAlign='right'; cx.textBaseline='middle';
  cx.fillText('NFL SEASON PREDICTOR 2026', W-PAD, fy+FOOT/2);

  // download
  const a = document.createElement('a');
  a.download = `${abbr}_2026_predictions.png`;
  a.href = cv.toDataURL('image/png');
  a.click();
}

// rounded rect helper (polyfill for older browsers)
function rr(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x+r, y);
  cx.lineTo(x+w-r, y);
  cx.quadraticCurveTo(x+w, y, x+w, y+r);
  cx.lineTo(x+w, y+h-r);
  cx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  cx.lineTo(x+r, y+h);
  cx.quadraticCurveTo(x, y+h, x, y+h-r);
  cx.lineTo(x, y+r);
  cx.quadraticCurveTo(x, y, x+r, y);
  cx.closePath();
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
renderTeams();
</script>
